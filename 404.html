<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | FTH</title>
  <link rel="stylesheet" href="css/style.css?v=12">
  <link rel="icon" type="image/png" href="img/logo-transparent.png">
</head>
<body>
  <!-- Simple navbar with just logo -->
  <nav class="navbar scrolled">
    <div class="container">
      <a href="/" class="nav-logo"><img src="img/logo-transparent.png" alt="FTH" class="nav-logo-img"></a>
      <div class="nav-right">
        <a href="/" class="nav-cta">Home</a>
      </div>
    </div>
  </nav>

  <section class="error-page">
    <div class="container">
      <div class="error-content">
        <span class="error-code">404</span>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <p class="error-ua">Сторінку не знайдено. Можливо, вона була переміщена або видалена.</p>
        <div class="error-actions">
          <a href="/" class="btn btn-green">Go to Homepage</a>
          <a href="/en" class="btn btn-outline">English Version</a>
        </div>
      </div>
    </div>
  </section>

  <script src="js/main.js?v=6"></script>
</body>
</html>
